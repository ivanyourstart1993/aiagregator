<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 820px; height: 312px; overflow: hidden; }
  .stage {
    width: 820px; height: 312px; position: relative;
    background:
      radial-gradient(90% 160% at 18% 28%, rgba(59,130,246,.16), transparent 55%),
      radial-gradient(80% 150% at 92% 90%, rgba(201,78,54,.12), transparent 55%),
      #121009;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(247,242,236,.045) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(0,0,0,.55); }
  .col {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
  }
  .row { display: flex; align-items: center; gap: 26px; }
  .tile {
    width: 78px; height: 78px; border-radius: 19px;
    background: linear-gradient(158deg, #5b9bff 0%, #2f6fe0 100%);
    box-shadow: 0 14px 34px rgba(47,111,224,.40), inset 0 1px 0 rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 54px; height: 54px; }
  .wordmark {
    font-size: 70px; line-height: 1; color: #F7F2EC; letter-spacing: -1.5px; font-weight: 700;
  }
  .tagline {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; color: #B7ABA0; letter-spacing: .2px; font-style: italic;
  }
  .tagline .bullet { width: 7px; height: 7px; border-radius: 50%; background: #C94E36; box-shadow: 0 0 10px rgba(201,78,54,.7); }
  .domain {
    position: absolute; right: 30px; bottom: 24px;
    font-family: Georgia, serif; font-size: 15px; letter-spacing: .5px;
    color: #8B8077;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="vignette"></div>
    <div class="col">
      <div class="row">
        <div class="tile">
          <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.4 21.2A2.4 2.4 0 0 0 12.7 19.5L5.4 17.6a.6.6 0 0 1 0-1.15l7.3-1.9A2.4 2.4 0 0 0 14.4 12.85L16.3 5.55a.6.6 0 0 1 1.15 0L19.35 12.85A2.4 2.4 0 0 0 21.05 14.55l7.3 1.9a.6.6 0 0 1 0 1.15l-7.3 1.9A2.4 2.4 0 0 0 19.35 21.2L17.45 28.5a.6.6 0 0 1-1.15 0z" transform="scale(0.85) translate(2.8 0)"/>
            <path d="M24 4v3M25.5 5.5h-3M7 23v2M8 24H6"/>
          </svg>
        </div>
        <div class="wordmark">Aigenway</div>
      </div>
      <div class="tagline">
        <span class="bullet"></span>
        One API for every AI image, video &amp; text model.
      </div>
    </div>
    <div class="domain">aigenway.com</div>
  </div>
</body>
</html>
