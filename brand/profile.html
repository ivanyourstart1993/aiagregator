<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 320px; height: 320px; overflow: hidden; }
  .stage {
    width: 320px; height: 320px; position: relative;
    background:
      radial-gradient(130% 130% at 50% 28%, rgba(59,130,246,.20), transparent 62%),
      #121009;
    display: flex; align-items: center; justify-content: center;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(247,242,236,.05) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .ring {
    position: absolute; width: 268px; height: 268px; border-radius: 50%;
    border: 1px solid rgba(247,242,236,.07);
  }
  .tile {
    width: 192px; height: 192px; border-radius: 44px; position: relative;
    background: linear-gradient(158deg, #5b9bff 0%, #2f6fe0 100%);
    box-shadow: 0 26px 64px rgba(47,111,224,.38), inset 0 1px 0 rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 134px; height: 134px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="ring"></div>
    <div class="tile">
      <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.4 21.2A2.4 2.4 0 0 0 12.7 19.5L5.4 17.6a.6.6 0 0 1 0-1.15l7.3-1.9A2.4 2.4 0 0 0 14.4 12.85L16.3 5.55a.6.6 0 0 1 1.15 0L19.35 12.85A2.4 2.4 0 0 0 21.05 14.55l7.3 1.9a.6.6 0 0 1 0 1.15l-7.3 1.9A2.4 2.4 0 0 0 19.35 21.2L17.45 28.5a.6.6 0 0 1-1.15 0z" transform="scale(0.85) translate(2.8 0)"/>
        <path d="M24 4v3M25.5 5.5h-3M7 23v2M8 24H6"/>
      </svg>
    </div>
  </div>
</body>
</html>
